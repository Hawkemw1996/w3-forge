app_id: w3forge
name: W3 Forge
version: 0.4.0

repo:
  url: ""
  default_dev_branch: dev/v0.1.0
  allowed_branch_pattern: '^dev/v[0-9]+\.[0-9]+\.[0-9]+$'
  blocked_branches:
    - main
    - master

paths:
  deploy: /opt/w3forge-deploy
  runtime: /opt/w3forge
  workspaces: /opt/w3forge-deploy
  scripts: /opt/scripts
  logs: /opt/logs/w3forge
  backups: /opt/backups/w3forge

service:
  name: ""

authority:
  may_inspect: true
  may_edit_dev_branch: true
  may_commit_dev_branch: true
  may_push_dev_branch: true
  may_deploy: false
  may_tag_release: false
  may_modify_production_data: false

# v0.2.0 workflow control: optional validation/test commands.
# Commands run inside paths.workspaces via w3-app-test.sh.
# Deploy / release / package-movement commands are blocked by guard.
#
# v0.2.1: safe self-test commands added for W3 Forge.
# require_local_model is opt-in; when false or absent the workflow
# does not WARN if Ollama is missing.
tests:
  validate_config: true
  require_local_model: false
  commands:
    - bash -n scripts/*.sh
    - ./scripts/w3-app-config-validate.sh --app w3forge
    - ./scripts/w3-app-branch-check.sh --app w3forge

# v0.4.0: Forge Admin Interface foundation.
# Loopback-bound local admin UI + backend. Controls list is the
# allowlist of Forge-safe scripts the safeRunner will execute.
# No deploy / release / package / backup-restore controls.
admin_console:
  enabled: true
  listen_host: 127.0.0.1
  listen_port: 8765
  audit_log: logs/admin/audit.jsonl
  allowed_scripts:
    - w3-app-config-validate.sh
    - w3-app-branch-check.sh
    - w3-app-git-status.sh
    - w3-app-status.sh
    - w3-app-local-model-test.sh
    - w3-app-inspect.sh
    - w3-app-test.sh
    - w3-app-workflow-status.sh
    - w3-app-diff-summary.sh
    - w3-app-review-report.sh
    - w3-app-review-ready.sh
