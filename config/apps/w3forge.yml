# Shared BuildCost admin contract; only Forge identity and installation paths differ.
app_id: w3forge
name: W3 Forge
version: 0.4.2
repo:
  url: https://github.com/Hawkemw1996/w3-forge.git
  default_dev_branch: dev/v0.4.2
  allowed_branch_pattern: ^dev/v[0-9]+\.[0-9]+\.[0-9]+$
  blocked_branches:
    - main
    - master
paths:
  deploy: /opt/w3forge-deploy
  runtime: /opt/w3forge
  scripts: /opt/w3forge-scripts
  logs: /opt/logs/w3forge
  backups: /opt/backups/w3forge
  update_packages: /opt/w3forge-update-packages
  installed_packages: /opt/w3forge-update-packages/installed
  workspaces: /opt/w3forge-deploy
service:
  name: w3forge-admin.service
  port: 8765
  health_url: http://127.0.0.1:8765/health
  version_url: http://127.0.0.1:8765/version
authority:
  may_inspect: true
  may_edit_dev_branch: true
  may_commit_dev_branch: true
  may_push_dev_branch: true
  may_deploy: true
  may_tag_release: false
  may_modify_production_data: false
  may_package: true
  requires_user_release_gate: true
admin_console:
  enabled: true
  listen_host: 127.0.0.1
  listen_port: 8765
  audit_log: logs/admin/audit.jsonl
  allowed_scripts:
    - w3-app-config-validate.sh
    - w3-app-branch-check.sh
    - w3-app-git-status.sh
    - w3-app-status.sh
    - w3-app-local-model-test.sh
    - w3-app-inspect.sh
    - w3-app-test.sh
    - w3-app-workflow-status.sh
    - w3-app-diff-summary.sh
    - w3-app-review-report.sh
    - w3-app-review-ready.sh
  role: master
  preserve_ui: true
  preserve_github_validation_tab: true
  preserve_controls_tab: true
  preserve_file_browser_tab: true
controls:
  mode: legacy-compatible
  registry_migration_status: controls_registry_foundation
  app_id: w3forge
  allow_legacy_w3forge_controls: true
file_browser:
  mode: legacy-compatible
  registry_migration_status: file_browser_foundation
  app_id: w3forge
  allow_host_local_roots: true
  allowed_roots:
    - app
    - deploy
    - deploy-scripts
    - deploy-docs
    - scripts
    - update-packages
    - update-packages-installed
    - backups
    - logs
    - cleanup-review
github_workflow:
  mode: legacy-compatible
  registry_migration_status: github_validation_foundation
  app_id: w3forge
  allow_release_pipeline: true
  enforce_main_protection: true
  enforce_release_gate: true
capabilities:
  database:
    enabled: true
    type: postgres
    readonly: false
    health_check: true
  controls:
    enabled: true
  github_validation:
    enabled: true
  file_browser:
    enabled: true
  logs:
    enabled: true
  health_monitoring:
    enabled: true
  deployment:
    enabled: true
  cooperative_development:
    enabled: false
tests:
  validate_config: true
  require_local_model: false
  commands:
    - bash -n scripts/*.sh
    - ./scripts/w3-app-config-validate.sh --app w3forge
    - ./scripts/w3-app-branch-check.sh --app w3forge
