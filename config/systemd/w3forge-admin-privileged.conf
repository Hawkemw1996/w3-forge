# OPTIONAL PRIVILEGED MODE — installed only by an explicit owner decision.
# This matches the reference BuildCost operational privilege model. Authenticated
# Core app administrators with Forge access can run the registered host operations
# after their per-action confirmations, including deployment, backup and recovery.
# The default w3forge-admin.service remains User=forgeadmin / Group=forgeadmin.
#
# Owner installation:
#   install -d -m 0755 /etc/systemd/system/w3forge-admin.service.d
#   install -m 0644 config/systemd/w3forge-admin-privileged.conf \
#     /etc/systemd/system/w3forge-admin.service.d/privileged.conf
#   systemctl daemon-reload
#
# Installing this file does not itself restart the service. Follow the documented
# runtime/database/bootstrap steps and review privileges before activation.
[Service]
User=root
Group=root
